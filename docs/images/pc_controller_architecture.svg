<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <rect width="960" height="360" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="1.5" />

  <!-- PC Desktop Controller Card -->
  <g transform="translate(40, 40)">
    <rect width="260" height="280" rx="12" fill="url(#card-grad)" stroke="#475569" stroke-width="1.5" />
    <rect width="260" height="36" rx="12" fill="#0f172a" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="130" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Kindle Remote HUD</text>
    
    <rect x="25" y="55" width="210" height="34" rx="6" fill="#0284c7" />
    <text x="130" y="77" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">下一页 (Next Page)</text>
    
    <rect x="25" y="100" width="210" height="34" rx="6" fill="#334155" stroke="#64748b" stroke-width="1" />
    <text x="130" y="122" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">上一页 (Prev Page)</text>

    <g transform="translate(25, 148)">
      <rect width="100" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="50" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">亮度 + (Key +)</text>
      <rect x="110" width="100" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="160" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">亮度 - (Key -)</text>
    </g>

    <rect x="25" y="188" width="210" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="130" y="206" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">息屏休眠 (Key S / P)</text>

    <text x="25" y="240" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">• 键盘全局捕获: Space / Enter / 方向键</text>
    <text x="25" y="258" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">• 串口通讯: 115200 (自动搜索 COM)</text>
  </g>

  <!-- Middle Bridge: ESP32 Hardware Adapter -->
  <g transform="translate(350, 90)">
    <rect width="240" height="180" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="120" y="35" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ESP32 适配器桥接</text>
    <text x="120" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">(ESP32-S3 / C3 USB Dongle)</text>

    <!-- Chip visualization -->
    <rect x="70" y="78" width="100" height="60" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="120" y="105" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ESP-IDF</text>
    <text x="120" y="123" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">● BLE HID 在线</text>

    <!-- Micro web server indicator -->
    <rect x="30" y="148" width="180" height="20" rx="10" fill="#0284c7" opacity="0.2" />
    <text x="120" y="162" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">HTTP Web: :8088</text>
  </g>

  <!-- Right Target: Kindle Paperwhite -->
  <g transform="translate(650, 40)">
    <rect width="270" height="280" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <rect x="25" y="20" width="220" height="240" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2" />
    
    <!-- Kindle Display Content -->
    <rect x="35" y="35" width="200" height="210" fill="#f1f5f9" />
    <text x="135" y="60" fill="#0f172a" font-family="Georgia, serif" font-size="14" font-weight="bold" text-anchor="middle">Kindle Paperwhite</text>
    <text x="135" y="80" fill="#475569" font-family="Georgia, serif" font-size="11" text-anchor="middle">第 12 代 / FW 5.20.1</text>
    
    <line x1="45" y1="95" x2="225" y2="95" stroke="#cbd5e1" stroke-width="1" />
    
    <text x="50" y="120" fill="#334155" font-family="Georgia, serif" font-size="11">• 原生蓝牙 HID 配对</text>
    <text x="50" y="142" fill="#334155" font-family="Georgia, serif" font-size="11">• 识别为 "Kindle Remote"</text>
    <text x="50" y="164" fill="#334155" font-family="Georgia, serif" font-size="11">• 无缝响应 PageUp / Down</text>
    <text x="50" y="186" fill="#334155" font-family="Georgia, serif" font-size="11">• 支持前光增减与息屏</text>

    <!-- Reading Progress Bar -->
    <rect x="45" y="215" width="180" height="6" rx="3" fill="#e2e8f0" />
    <rect x="45" y="215" width="85" height="6" rx="3" fill="#0284c7" />
    <text x="135" y="235" fill="#64748b" font-family="Georgia, serif" font-size="10" text-anchor="middle">Page 42 of 100 • 42%</text>
  </g>

  <!-- Connectors / Data Flow Arrows -->
  <path d="M 300 180 L 350 180" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" />
  <polygon points="348,175 358,180 348,185" fill="#38bdf8" />
  <text x="325" y="168" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">USB 串口</text>

  <path d="M 590 180 L 650 180" stroke="#34d399" stroke-width="3" stroke-dasharray="6 4" />
  <polygon points="648,175 658,180 648,185" fill="#34d399" />
  <text x="620" y="168" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">BLE HID</text>

  <path d="M 470 320 L 470 270" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3" />
  <polygon points="466,272 470,262 474,272" fill="#fbbf24" />
  <text x="470" y="338" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">📱 局域网手机浏览器扫码触屏遥控 (Wi-Fi HTTP)</text>
</svg>